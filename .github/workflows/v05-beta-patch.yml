name: V0.5 Beta Patch

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/v05-beta-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
      - name: Apply V0.5 patch
        run: python3 .github/scripts/v05_beta_patch.py
      - name: Verify patch
        run: |
          grep -q 'TRANSFORMATION READY' index.html
          grep -q 'during the swap' index.html
          grep -q 'horrorMotif' index.html
          if grep -q 'Testing: unrestricted transformation' index.html; then exit 1; fi
      - name: Commit V0.5 beta
        run: |
          git config user.name 'V0.5 Beta Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git rm .github/workflows/v05-beta-patch.yml .github/scripts/v05_beta_patch.py
          git commit -m 'Implement V-0.5 Beta combat transformations switching and horror music'
          git push origin dev
