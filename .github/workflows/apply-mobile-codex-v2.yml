name: Apply mobile codex v2

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/apply-mobile-codex-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch index
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* MOBILE_ITEM_CODEX_FIX_V2 */'
          if marker not in text:
              css = """
          /* MOBILE_ITEM_CODEX_FIX_V2 */
          @media(max-width:600px){
            .codex-card.item-codex-card{
              display:flex!important;
              flex-direction:column!important;
              gap:12px!important;
              padding:14px!important;
            }
            .item-codex-card .item-codex-art{
              width:100%!important;
              height:180px!important;
              aspect-ratio:auto!important;
              margin:0!important;
              border-radius:10px!important;
              flex:none!important;
            }
            .item-codex-card > div:last-child{
              width:100%!important;
              min-width:0!important;
              display:block!important;
            }
            .item-codex-card h3{
              margin:4px 0 8px!important;
              font-size:28px!important;
              line-height:1.08!important;
            }
            .item-codex-card p{
              margin:10px 0 0!important;
              font-size:14px!important;
              line-height:1.55!important;
            }
            .item-codex-card .item-type-badge{
              display:block!important;
              margin:0 0 4px!important;
            }
          }
          """
              text = text.replace('</style>', css + '\n</style>', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix obtainable item codex overlap on phones"
          git push origin dev
