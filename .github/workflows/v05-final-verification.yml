name: V0.5 Final Verification

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v05-final-verification.yml'
      - 'index.html'
      - '*.webp'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Verify required artwork
        run: |
          test -s thornbound.jpg
          test -s veinmaw.jpg
          test -s ashwraith.jpg
          test -s root-fusion-1.webp
          test -s root-fusion-2.webp
          test -s root-fusion-3.webp
          test -s root-fusion-4.webp

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',t,re.S)
          Path('/tmp/game.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/game.js

      - name: Verify V0.5 regression checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text()
          checks={
            'guardian art': all(x in t for x in ['thornbound.jpg','veinmaw.jpg','ashwraith.jpg']),
            'four cutscene panels': all(x in t for x in ['root-fusion-1.webp','root-fusion-2.webp','root-fusion-3.webp','root-fusion-4.webp']),
            'cutscene next controller': 'rootFusionOverlay' in t and 'nextRootFusionScene' in t and 'SCENE ' in t,
            '3/3 fusion trigger': 'if(defeated>=3 && !G.rootFusionTriggered)' in t and 'showRootFusionCutscene();' in t,
            'safe third guardian cleanup': 'const fallenGuardian=combat;' in t and 'G.creatures=G.creatures.filter(c=>c!==fallenGuardian);' in t and 'showRootFusionCutscene();\n    return;' in t,
            'triune stats': 'name:"The Triune Maw"' in t and 'hp:120' in t and 'atk:14' in t and 'armor:80' in t,
            'triune correct damage variable': 'if(c.hp<=c.maxHp*0.5)damage+=3;' in t and 'if(c.triuneAttackCount%3===0){damage+=6;' in t,
            'rootstorm combat actions': 'p.combatActions=Math.max(0,(p.combatActions||0)-drained)' in t and 'p.combatAp' not in t,
            'triune armor': 'combat.rootFusionBoss && (combat.armor||0)>0' in t,
            'root lock': 'relicsComplete&&G.rootGateUnlocked&&G.rootFusionDefeated&&!G.rootDefeated' in t,
            'triune defeat unlocks root': 'if(combat.name==="The Triune Maw")' in t and 'G.rootGateUnlocked=true' in t,
            'fusion save recovery': 'a save made after the fusion trigger must never strand the Root gate' in t and 'spawnTriuneMaw();' in t,
            'three-night transformations': 'p.transformedThroughNight=G.night+2' in t and 'if(G.night>p.transformedThroughNight)' in t,
            'party combat switching': 's.combatActions=combatActionCount(s)' in t,
            'mobile cutscene': '@media(max-width:600px)' in t and '.root-fusion-overlay{padding:8px}' in t,
            'new update player notes': 'New Fusion Encounter:' in t and 'Safer Boss Progression:' in t and 'Horror Soundtrack:' in t,
            'main menu creature paging': 'NEXT: NEW CREATURES' in t and 'showNewGuardianSection' in t and 'showNewSurvivorSection' in t,
            'transformation preview': 'VIEW TRANSFORMATION' in t and 'previewRootFusionScene' in t and 'Transformation Preview' in t,
            'full codex fusion roster': 'ROOT_FUSION_CODEX' in t and "CRE.length+1" in t and 'FUSION THREAT' in t,
            'tonal horror soundtrack': 'const chordSets=[' in t and 'playHorrorNote' in t and 'const roomTones=' in t,
            'no static noise buffer': 'createBufferSource' not in t and 'noiseBuffer' not in t and 'noiseData' not in t,
          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(f'{k}: {"PASS" if v else "FAIL"}')
          if bad: raise SystemExit('Failed: '+', '.join(bad))
          print('All V0.5 regression checks passed.')
          PY

# verification run after final artwork upload
