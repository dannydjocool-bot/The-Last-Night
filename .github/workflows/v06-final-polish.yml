name: V0.6 Final Polish

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/v06-final-polish.py'
      - '.github/workflows/v06-final-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/v06-final-polish.py
      - name: Commit polish
        run: |
          if git diff --quiet -- v06-enhancements.js v06-enhancements.css; then
            echo "No polish changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v06-enhancements.js v06-enhancements.css
          git commit -m "V0.6: finish transition phase and lock polish"
          git push origin dev
