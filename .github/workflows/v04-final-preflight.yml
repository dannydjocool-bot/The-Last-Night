name: V0.4 final preflight
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v04-final-preflight.yml'
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Add save persistence to update notes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          if 'Existing save progress is preserved across future game updates' not in text:
              marker='<ul class="update-details-list">'
              i=text.find(marker)
              if i == -1:
                  raise SystemExit('Update details list not found')
              insert='\n      <li><strong>Save Progress Protection:</strong> Existing save progress is preserved across future game updates, with automatic compatibility recovery and a backup copy for each save slot.</li>'
              text=text[:i+len(marker)] + insert + text[i+len(marker):]
          p.write_text(text,encoding='utf-8')
          PY
      - name: Run V0.4 regression preflight
        run: |
          python3 <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, sys
          text=Path('index.html').read_text(encoding='utf-8')

          checks={
            'V-0.4 Beta label':'V-0.4 Beta' in text,
            'New Update badge':'library-update-badge' in text and 'New Update' in text,
            'Update details panel':'id="updateDetailsPanel"' in text,
            'Update panel above library':'#updateDetailsPanel{position:fixed;inset:0;z-index:26000' in text,
            'Back to Library':'← Back to Library' in text and 'href="#gameLibrary"' in text,
            'Save protection update note':'Existing save progress is preserved across future game updates' in text,
            'Stable save key':'const SAVE_PREFIX="theLastNightSaveSlot";' in text,
            'Backup save key':'const SAVE_BACKUP_PREFIX="theLastNightPersistentSaveSlot";' in text,
            'Save format v3':'const SAVE_VERSION=3;' in text,
            'Save migration':'function findCompatibleSaveRaw(slot)' in text and 'mirrorExistingSaves();' in text,
            'Dual-write saves':'localStorage.setItem(SAVE_PREFIX+slot,serialized);' in text and 'localStorage.setItem(SAVE_BACKUP_PREFIX+slot,serialized);' in text,
            'Mobile Extra Pockets rules':'@media(max-width:850px)' in text and 'extra-pockets' in text.lower(),
            'Mobile item codex fix':'MOBILE_ITEM_CODEX_FIX' in text or 'obtainable' in text.lower(),
            'Mobile visual fit rules':'mobile-visual-fit' in text.lower() or '@media(max-width:600px)' in text,
            'Transform card Safari support':'backface-visibility' in text and '-webkit-backface-visibility' in text,
          }
          failed=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('PASS' if v else 'FAIL')+': '+k)
          if failed:
              raise SystemExit('Preflight failures: '+', '.join(failed))

          class Parser(HTMLParser):
              pass
          Parser().feed(text)
          print('PASS: HTML parser accepted document')

          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,flags=re.S|re.I)
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print(f'Extracted {len(scripts)} inline script block(s) for syntax check')
          PY
          node --check /tmp/inline.js
      - name: Commit verified update notes
        run: |
          if git diff --quiet -- index.html; then
            echo "No update-note changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add save protection to V0.4 update notes"
          git push origin dev
