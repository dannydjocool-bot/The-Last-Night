name: Add New Update badge

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/add-new-update-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch library update badge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          css='''\n.library-update-badge{position:absolute;right:24px;top:66px;z-index:3;margin:0;padding:8px 11px;border:1px solid rgba(227,107,117,.72);border-radius:99px;background:rgba(113,27,38,.82);color:#ffe7e9;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;backdrop-filter:blur(8px);box-shadow:0 0 20px rgba(191,58,71,.22)}.library-update-badge:hover{border-color:#f08a94;background:rgba(141,36,48,.94)}.update-info-overlay{position:fixed;inset:0;z-index:15600;display:none;place-items:center;padding:20px;background:rgba(0,0,0,.88);backdrop-filter:blur(9px)}.update-info-overlay.open{display:grid}.update-info-card{width:min(620px,100%);max-height:88dvh;overflow:auto;border:1px solid #72434a;border-radius:17px;background:linear-gradient(150deg,#211619,#0b0c0e 65%);box-shadow:0 30px 100px #000,0 0 45px rgba(175,48,61,.16);padding:26px}.update-info-kicker{color:#df737c;font-size:10px;font-weight:900;letter-spacing:3px;text-transform:uppercase}.update-info-card h2{margin:8px 0 10px;font-family:Georgia,serif;letter-spacing:2px}.update-info-card p{margin:0;color:#c0c4c8;line-height:1.65}.update-info-list{margin:16px 0 0;padding-left:20px;color:#c9cdd1;line-height:1.6}.update-info-list li{margin:7px 0}.update-info-close{margin:20px 0 0}@media(max-width:600px){.library-update-badge{right:14px;top:58px;padding:7px 9px;font-size:9px;letter-spacing:1.4px}.update-info-card{padding:21px}}\n'''
          if '.library-update-badge{' not in text:
              text=text.replace('</style>',css+'</style>',1)

          overlay='''\n<div id="updateInfoOverlay" class="update-info-overlay" role="dialog" aria-modal="true" aria-labelledby="updateInfoTitle" onclick="closeUpdateInfo(event)">\n  <section class="update-info-card" onclick="event.stopPropagation()">\n    <div class="update-info-kicker">Latest Build</div>\n    <h2 id="updateInfoTitle">V-0.4 Beta — New Update</h2>\n    <p>This update focuses on improving the overall experience, especially on phones, while keeping the PC layout intact.</p>\n    <ul class="update-info-list">\n      <li>Improved mobile layout for the Main Pack / Extra Pockets panel.</li>\n      <li>Fixed transforming survivor cards so flipped text no longer overlaps.</li>\n      <li>Improved Obtainable Items Codex spacing and mobile item image fitting.</li>\n      <li>Adjusted main-menu survivor portraits on phones so heads are less likely to be cropped.</li>\n      <li>Added the clickable V-0.4 Beta development message.</li>\n      <li>Additional mobile polish and readability fixes across menus.</li>\n    </ul>\n    <button class="update-info-close" type="button" onclick="closeUpdateInfo()">Close</button>\n  </section>\n</div>\n'''
          if 'id="updateInfoOverlay"' not in text:
              text=text.replace('</body>',overlay+'\n</body>',1)

          js='''\nfunction openUpdateInfo(){document.getElementById("updateInfoOverlay")?.classList.add("open");document.body.style.overflow="hidden";}\nfunction closeUpdateInfo(event){if(event&&event.target!==document.getElementById("updateInfoOverlay"))return;document.getElementById("updateInfoOverlay")?.classList.remove("open");document.body.style.overflow="";}\nfunction installLibraryUpdateBadge(){const art=document.querySelector(".library-art");if(!art||art.querySelector(".library-update-badge"))return;const b=document.createElement("button");b.type="button";b.className="library-update-badge";b.textContent="New Update";b.setAttribute("aria-haspopup","dialog");b.addEventListener("click",openUpdateInfo);art.appendChild(b);}\nif(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",installLibraryUpdateBadge);}else{installLibraryUpdateBadge();}\n'''
          if 'function installLibraryUpdateBadge()' not in text:
              text=text.replace('</script>',js+'\n</script>',1)

          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit update badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add clickable New Update badge to game library"
          git push origin dev
