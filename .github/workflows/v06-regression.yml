name: V0.6 Regression

on:
  push:
    branches: [dev]
    paths:
      - 'index.html'
      - 'v06-enhancements.js'
      - 'v06-enhancements.css'
      - 'story-smoke-test.js'
      - 'objective-investigate-smoke-test.js'
      - '.github/scripts/v06-player-clarity.py'
      - '.github/scripts/v06-release-copy.py'
      - '.github/scripts/v06-active-objective-glow.py'
      - '.github/workflows/v06-release-copy.yml'
      - '.github/workflows/v06-active-objective-glow.yml'
      - '.github/workflows/v06-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Check core JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script>(.*?)</script>',html,re.S))
          Path('/tmp/the-last-night-core.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/the-last-night-core.js
          node --check v06-enhancements.js

      - name: Run story and combat smoke test
        run: node story-smoke-test.js

      - name: Run objective Investigate interaction test
        run: node objective-investigate-smoke-test.js

      - name: Release candidate static audit
        run: |
          python3 - <<'PY'
          from pathlib import import Path
          PY
