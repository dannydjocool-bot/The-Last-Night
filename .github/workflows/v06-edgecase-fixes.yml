name: V0.6 Edge Case Fixes

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v06-edgecase-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply validated edge-case fixes
        run: python .github/scripts/v06_edgecase_fixes.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v06-enhancements.js
          git diff --cached --quiet && exit 0
          git commit -m 'V0.6: fix remaining gameplay edge cases'
          git push origin dev
