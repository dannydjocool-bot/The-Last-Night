name: Apply mobile visual fit v5

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/mobile-visual-fit-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch index
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile item art and menu portrait cropping"
          git push origin dev
