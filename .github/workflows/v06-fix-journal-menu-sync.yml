name: V0.6 Fix Journal Menu Sync

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v06-fix-journal-menu-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch mobile dock touch layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v06-enhancements.css')
          s=p.read_text(encoding='utf-8')
          anchor="@media(max-width:850px){\n  body:not(.menu-mode) #logButton,body:not(.menu-mode) .v06-journal-btn{display:none!important}"
          replacement="@media(max-width:850px){\n  body:not(.menu-mode) #gameSite{position:relative!important;z-index:1!important}\n  body:not(.menu-mode) #logButton,body:not(.menu-mode) .v06-journal-btn{display:none!important}"
          if 'body:not(.menu-mode) #gameSite{position:relative!important;z-index:1!important}' not in s:
              if anchor not in s: raise SystemExit('Mobile media anchor not found')
              s=s.replace(anchor,replacement,1)
          s=s.replace('z-index:30050!important','z-index:2147483000!important',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: node --check v06-enhancements.js
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v06-enhancements.css
          git commit -m "V0.6: isolate mobile dock above gameplay layer"
          git push origin dev
