name: V0.6 Release Info Update

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/v06-update-release-info.py'
      - '.github/workflows/v06-update-release-info.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release-info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/v06-update-release-info.py
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No release info changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "V0.6: update main menu and library release info"
          git push origin dev
