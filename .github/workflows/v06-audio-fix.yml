name: V0.6 Horror Audio Fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v06-audio-fix.yml'

permissions:
  contents: write

jobs:
  patch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch cinematic horror soundtrack
        run: python3 .github/scripts/v06_audio_fix.py
      - name: Commit audio fix to dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V0.6: cinematic horror soundtrack"
          git push origin dev
