name: V0.6 Real Browser Playthrough

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'index.html'
      - 'v06-enhancements.js'
      - 'v06-enhancements.css'
      - 'browser-e2e-test.js'
      - '.github/workflows/v06-browser-e2e.yml'

permissions:
  contents: read

jobs:
  browser-playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Install Playwright Chromium
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve exact dev build locally
        run: |
          python3 -m http.server 4173 >/tmp/the-last-night-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/the-last-night-http.log || true
          exit 1

      - name: Run desktop and mobile real-browser playthrough
        env:
          TEST_URL: http://127.0.0.1:4173/index.html
        run: node browser-e2e-test.js
